name: Staging pipeline

on:
  push:
    branches: [staging, "devops/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci
      DATABASE_URL: postgres://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --noinput
  build:
    # Запускається лише після успішного test і лише для push (не для Pull Request)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Права тільки для цього job: читати код і писати образ у GHCR
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Повна назва образу, тільки малі літери: ghcr.io/annagorova/healthproject-django:sha-<12 символів коміту>
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Вхід у GHCR тимчасовим токеном GitHub. Своїх паролів не потрібно
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

      # Перевірка, що контейнер із цього образу запускається і бачить налаштування Django
      - name: Smoke test of the image
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-only-key -e DEBUG=False -e ALLOWED_HOSTS=localhost \
            -e EMAIL_HOST_USER=ci@example.com -e EMAIL_HOST_PASSWORD=ci \
            -e DATABASE_URL=postgres://u:p@localhost:5432/d \
            "${{ steps.meta.outputs.image }}" python manage.py check
  deploy:
    # Тільки push у гілку staging, не devops/** і не Pull Request
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    # id-token: write потрібен, щоб отримати AWS-права через OIDC (без ключів)
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DEPLOY_HOST: "13.53.125.115"
      DEPLOY_USER: admin
      SG_ID: sg-0cb82a80a46178a82
      AWS_REGION: eu-north-1
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Відкриваємо SSH лише для IP цього запуску
      - name: Open SSH for this runner only
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"
          sleep 5

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy files
        run: |
          scp docker-compose.yml deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/shb/"
          scp nginx/default.conf "$DEPLOY_USER@$DEPLOY_HOST:/opt/shb/nginx/default.conf"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/shb/deploy.sh '$IMAGE'; rc=\$?; docker logout ghcr.io; exit \$rc"

      - name: Verify from outside
        run: curl -fsS --retry 5 --retry-delay 5 --max-time 10 -o /dev/null "http://$DEPLOY_HOST/"

      # Закриваємо SSH завжди, навіть якщо деплой впав
      - name: Close SSH
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" || true
          fi