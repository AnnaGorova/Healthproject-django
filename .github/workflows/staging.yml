name: Staging pipeline

on:
  push:
    branches: [staging, "devops/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci
      DATABASE_URL: postgres://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --noinput
  build:
    # Запускається лише після успішного test і лише для push (не для Pull Request)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Права тільки для цього job: читати код і писати образ у GHCR
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Повна назва образу, тільки малі літери: ghcr.io/annagorova/healthproject-django:sha-<12 символів коміту>
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Вхід у GHCR тимчасовим токеном GitHub. Своїх паролів не потрібно
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

      # Перевірка, що контейнер із цього образу запускається і бачить налаштування Django
      - name: Smoke test of the image
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-only-key -e DEBUG=False -e ALLOWED_HOSTS=localhost \
            -e EMAIL_HOST_USER=ci@example.com -e EMAIL_HOST_PASSWORD=ci \
            -e DATABASE_URL=postgres://u:p@localhost:5432/d \
            "${{ steps.meta.outputs.image }}" python manage.py check