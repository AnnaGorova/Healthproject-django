<div class="admin-user-actions">
    <a href="{% url 'admin_user_edit' u.id %}" class="admin-user-edit"
       aria-label="Редагувати користувача {{ u.username }}" title="Редагувати">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m16 3 5 5-12 12-6 1 1-6L16 3Z"/><path d="m14 5 5 5"/>
        </svg>
    </a>
    {% if u.id != request.user.id and not u.is_superuser %}
        <form method="post" action="{% url 'admin_user_toggle' u.id %}">
            {% csrf_token %}
            <button type="submit" class="admin-user-toggle{% if not u.is_active %} is-inactive{% endif %}"
                    aria-label="{% if u.is_active %}Деактивувати{% else %}Активувати{% endif %} користувача {{ u.username }}"
                    title="{% if u.is_active %}Деактивувати{% else %}Активувати{% endif %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 2v10"/><path d="M6 5a9 9 0 1 0 12 0"/>
                </svg>
            </button>
        </form>
    {% endif %}
</div>
