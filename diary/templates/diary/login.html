{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Smart Health Bridge</title>
    <link rel="stylesheet" href="{% static 'diary/css/login.css' %}">
</head>
<body class="login-body">
    <main class="login-layout" aria-labelledby="login-title">
        <div class="login-illustration">
            <img src="{% static 'diary/images/login-illustration.png' %}"
                 alt="Ваше здоров’я в одному місці. Сучасні медичні послуги, турбота та зручний доступ."
                 width="676" height="905">
        </div>
        <section class="login-form-panel">
            <h1 id="login-title">З поверненням</h1>
            {% if messages %}
                <div class="login-messages" role="alert">
                    {% for message in messages %}
                        <p class="login-message">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Електронна пошта</label>
                    <input type="email" name="email" id="email"
                           value="{{ request.POST.email|default:'' }}"
                           placeholder="Введіть електронну пошту"
                           autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password"
                               placeholder="Введіть пароль"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-password"
                                onclick="togglePassword()"
                                aria-label="Показати або приховати пароль"
                                aria-controls="password"></button>
                    </div>
                </div>
                <button type="submit" class="login-submit">Увійти</button>
                <a href="{% url 'password_reset' %}" class="forgot-password">Забули пароль?</a>
            </form>
        </section>
    </main>
    <dialog class="login-loading"
            id="login-loading"
            aria-labelledby="login-loading-title">
        <p id="login-loading-title">Підтвердження входу</p>
        <span class="login-spinner" aria-hidden="true"></span>
    </dialog>
    <script src="{% static 'diary/js/login.js' %}"></script>
</body>
</html>
